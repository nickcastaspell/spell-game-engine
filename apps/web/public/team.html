<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Squadra — Spell Game Engine</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    /* Stessa palette/font del vecchio gioco Apps Script ("Caccia al
       Tesoro"): carta/oro per il giocatore — vedi facilitator.html per il
       tema scuro dell'admin/facilitatore, deliberatamente diverso, stessa
       distinzione dell'originale. */
    :root {
      --ink: #1a1209; --paper: #f7f2e8; --paper2: #efe8d5;
      --gold: #c8922a; --gold-light: #f0c86a; --rust: #b94a2c; --sage: #4a6741;
      --muted: #7a6e5f; --border: #d4c9b0; --radius: 12px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'DM Sans', sans-serif; font-size: 15px; line-height: 1.6; -webkit-tap-highlight-color: transparent; }
    h1, h3 { font-family: 'Playfair Display', serif; margin: 0; }
    #app { max-width: 420px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

    #login { background: var(--ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 28px; }
    .login-card { width: 100%; max-width: 340px; }
    .login-logo { font-family: 'Playfair Display', serif; font-size: 40px; font-weight: 900; color: var(--gold-light); text-align: center; line-height: 1.1; margin-bottom: 8px; }
    .login-sub { color: #7a6a55; font-size: 12px; text-align: center; letter-spacing: .5px; text-transform: uppercase; margin-bottom: 40px; }
    .login-box { background: rgba(255,255,255,.05); border: 1px solid #2e2416; border-radius: 16px; padding: 26px 22px; }
    .login-box label { display: block; font-size: 12px; letter-spacing: .6px; text-transform: uppercase; color: #a89880; margin-bottom: 8px; }
    .login-box input { width: 100%; padding: 13px 14px; background: rgba(255,255,255,.07); border: 1.5px solid #2e2416; border-radius: var(--radius); color: var(--paper); font-family: 'DM Sans', sans-serif; font-size: 16px; letter-spacing: 2px; text-transform: uppercase; outline: none; margin-bottom: 18px; box-sizing: border-box; }
    .login-box input:focus { border-color: var(--gold); }
    .login-box input::placeholder { letter-spacing: 1px; text-transform: none; opacity: .4; }
    #login #err { color: var(--rust); font-size: 13px; margin-top: 4px; }

    .header { background: var(--ink); color: var(--paper); padding: 14px 20px 12px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
    .header-squad { font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 700; }
    #status { background: var(--gold); color: var(--ink); font-weight: 500; font-size: 13px; padding: 5px 12px; border-radius: 20px; }
    .badge { display: inline-block; padding: .2rem .6rem; border-radius: 999px; font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
    .badge.open { background: var(--gold-light); color: var(--ink); }
    .badge.closed { background: #2e2416; color: #a89880; }

    #activity, #map-wrap { padding: 20px; }
    #activity { flex: 1; }
    .tappa-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .tappa-number { background: var(--ink); color: var(--gold-light); font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 900; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .tappa-label { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); }
    .tappa-title { font-family: 'Playfair Display', serif; font-size: 17px; font-weight: 700; line-height: 1.3; }
    .clue-box { background: var(--paper2); border: 1px solid var(--border); border-left: 4px solid var(--gold); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 18px; font-size: 15px; line-height: 1.7; }

    input[type="text"], input:not([type]), input[type="number"], input[type="file"], textarea { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: var(--radius); background: white; font-family: 'DM Sans', sans-serif; font-size: 15px; color: var(--ink); outline: none; box-sizing: border-box; margin-bottom: 10px; }
    input:focus, textarea:focus { border-color: var(--gold); }
    .btn { display: block; width: 100%; padding: 13px; border-radius: var(--radius); border: none; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500; cursor: pointer; margin-bottom: 8px; text-align: center; }
    .btn:active { opacity: .85; }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn-primary { background: var(--ink); color: var(--paper); }
    .btn-gold { background: var(--gold); color: white; }
    .btn-secondary { background: transparent; color: var(--muted); border: 1.5px solid var(--border); font-size: 13px; padding: 10px; }

    .hint-box { background: #fff8e6; border: 1px solid #e8c96a; border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; }
    .hint-label { font-size: 11px; text-transform: uppercase; letter-spacing: .7px; color: #9a7010; margin-bottom: 6px; font-weight: 500; }
    .status-pill { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: var(--radius); font-size: 13px; margin-bottom: 12px; }
    .status-attesa { background: #fef3dc; color: #9a6b10; }
    .status-fallback { background: var(--paper2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-top: 10px; }
    .status-fallback small { color: var(--muted); }

    .voucher-card { background: var(--ink); border-radius: 16px; padding: 24px 22px; text-align: center; margin-bottom: 16px; }
    .voucher-title { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: #a89880; margin-bottom: 14px; }
    .voucher-code { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 900; color: var(--gold-light); letter-spacing: 3px; }

    .completed-banner { text-align: center; padding: 32px 20px; }
    .completed-icon { font-size: 48px; margin-bottom: 12px; }
    .completed-title { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 900; color: var(--sage); margin-bottom: 6px; }
    .completed-pts { font-size: 14px; color: var(--muted); }

    #submitErr { color: var(--rust); font-size: 13px; margin: 0 0 8px; }
    #map { height: 240px; border-radius: var(--radius); margin-top: 4px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div id="app">
    <div id="login">
      <div class="login-card">
        <div class="login-logo">Squadra</div>
        <p class="login-sub">Inserisci il codice per iniziare</p>
        <div class="login-box">
          <label for="code">Codice squadra</label>
          <input id="code" placeholder="ES. AB12CD" autocomplete="off" />
          <button class="btn btn-gold" id="loginBtn">Entra</button>
          <p id="err"></p>
        </div>
      </div>
    </div>

    <div id="game" class="hidden">
      <div class="header">
        <span class="header-squad" id="teamName"></span>
        <span id="statusBadge" class="badge"></span>
      </div>
      <div id="status"></div>
      <div id="activity"></div>
      <div id="map-wrap"><div id="map" class="hidden"></div></div>
    </div>
  </div>

  <script>
    const API = "";
    let token = localStorage.getItem("spell_team_token");
    let teamName = localStorage.getItem("spell_team_name");
    let pollTimer = null;

    async function api(path, opts = {}) {
      const res = await fetch(API + path, {
        ...opts,
        headers: {
          "Content-Type": "application/json",
          ...(token ? { Authorization: "Bearer " + token } : {}),
          ...(opts.headers || {}),
        },
      });
      const body = await res.json();
      if (!res.ok || !body.ok) {
        throw new Error(body.error?.message || "Errore");
      }
      return body.data;
    }

    async function login() {
      const code = document.getElementById("code").value.trim().toUpperCase();
      document.getElementById("err").textContent = "";
      try {
        const data = await api("/api/team/login", {
          method: "POST",
          body: JSON.stringify({ accessCode: code }),
        });
        token = data.token;
        teamName = data.teamName;
        localStorage.setItem("spell_team_token", token);
        localStorage.setItem("spell_team_name", teamName);
        showGame();
      } catch (e) {
        document.getElementById("err").textContent = e.message;
      }
    }

    function showGame() {
      document.getElementById("login").classList.add("hidden");
      document.getElementById("game").classList.remove("hidden");
      document.getElementById("teamName").textContent = teamName;
      poll();
      pollTimer = setInterval(poll, 4000);
    }

    let renderedActivityKey = null; // vedi renderState: evita di ricostruire il form ad ogni poll

    async function poll() {
      try {
        const state = await api("/api/team/state");
        if (!state.activity && state.currentPhaseId) {
          try {
            const itin = await api("/api/team/itinerary/status");
            document.getElementById("statusBadge").textContent = "In percorso";
            document.getElementById("statusBadge").className = "badge open";
            document.getElementById("status").textContent = `${itin.score} pt`;
            renderItinerary(itin);
            return;
          } catch (e) {
            // non è una fase itinerary (400) o nessuna fase corrente (409): rendering normale sotto
          }
        }
        renderState(state);
      } catch (e) {
        // token scaduto/revocato (es. login da un altro dispositivo)
        if (String(e.message).toLowerCase().includes("token")) {
          localStorage.removeItem("spell_team_token");
          clearInterval(pollTimer);
          location.reload();
        }
      }
    }

    function renderState(state) {
      const badge = document.getElementById("statusBadge");
      badge.textContent = state.phaseStatus === "OPEN" ? "Fase aperta" : "In attesa della regia";
      badge.className = "badge " + (state.phaseStatus === "OPEN" ? "open" : "closed");

      const statusEl = document.getElementById("status");
      statusEl.textContent = `${state.score} pt`;

      // Il poll gira ogni 4s anche mentre la squadra sta ancora compilando.
      // Se non filtriamo qui, ogni tick ricostruisce il form (innerHTML)
      // e cancella le categorie già assegnate — bug reale segnalato in aula.
      // Ridisegniamo il form SOLO quando cambia qualcosa di rilevante
      // (fase aperta/chiusa, invio effettuato, attività diversa), non ad
      // ogni singolo poll.
      const key = JSON.stringify({
        phaseId: state.currentPhaseId,
        activityId: state.activityId,
        submitted: state.submitted,
        phaseStatus: state.phaseStatus,
        hasActivity: Boolean(state.activity),
      });
      if (key === renderedActivityKey) return;
      renderedActivityKey = key;

      const el = document.getElementById("activity");
      if (!state.activity) {
        el.innerHTML = "<p>Nessuna attività attiva al momento.</p>";
        return;
      }
      if (state.submitted) {
        el.innerHTML = "<p><strong>Invio registrato.</strong> Attendi la regia per il prossimo passo.</p>";
        return;
      }
      if (state.phaseStatus !== "OPEN") {
        el.innerHTML = "<p>La fase non è ancora aperta.</p>";
        return;
      }
      const renderer = activityRenderers[state.activity.type];
      if (renderer) {
        renderer(el, state.activity, state.activityId);
      } else {
        el.innerHTML = "<p>Tipo di attività non supportato da questa interfaccia.</p>";
      }
    }

    // --- Itinerario (percorso per squadra, es. "Il mistero della città") ---
    // start/buono avanzano da soli (nessun input dalla squadra): li inviamo
    // in automatico non appena diventano la tappa corrente, una sola
    // volta per tappa (renderedItineraryStepId evita il doppio invio ad
    // ogni tick di poll, stesso principio di renderedActivityKey sopra).
    let renderedItineraryStepId = null;
    let lastVoucherToken = null;

    // Mappa del percorso proprio (Fase 5): tappe già fatte in verde, tappa
    // corrente evidenziata, tappe future assenti dalla mappa salvo che la
    // caccia dichiari itinerary.showUpcomingStops (già filtrato lato
    // server in "route" — qui disegniamo solo quello che arriva).
    let map = null;
    let mapMarkersLayer = null;
    let mapRenderedForKey = null; // non ridisegnare ad ogni poll se la tappa corrente non è cambiata

    function renderItineraryMap(route, key) {
      const mapEl = document.getElementById("map");
      const withCoords = (route || []).filter((r) => typeof r.lat === "number" && typeof r.lng === "number");
      if (withCoords.length === 0) {
        mapEl.classList.add("hidden");
        return;
      }
      mapEl.classList.remove("hidden");
      if (mapRenderedForKey === key) return;
      mapRenderedForKey = key;

      if (!map) {
        map = L.map("map");
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "© OpenStreetMap" }).addTo(map);
      }
      if (mapMarkersLayer) map.removeLayer(mapMarkersLayer);
      mapMarkersLayer = L.layerGroup();

      const colorByStatus = { done: "#4a6741", current: "#c8922a", upcoming: "#9ca3af" };
      withCoords.forEach((r) => {
        const marker = L.circleMarker([r.lat, r.lng], {
          radius: r.status === "current" ? 10 : 7,
          color: colorByStatus[r.status],
          fillColor: colorByStatus[r.status],
          fillOpacity: 0.85,
        });
        if (r.title) marker.bindTooltip(`${r.number}. ${r.title}`);
        marker.addTo(mapMarkersLayer);
      });
      mapMarkersLayer.addTo(map);

      const focus = withCoords.find((r) => r.status === "current") ?? withCoords[withCoords.length - 1];
      map.setView([focus.lat, focus.lng], 16);
    }

    function tappaHeader(progress, title) {
      const num = progress.match(/\d+/);
      return `
        <div class="tappa-header">
          <div class="tappa-number">${num ? num[0] : ""}</div>
          <div>
            <div class="tappa-label">${progress}</div>
            <div class="tappa-title">${title}</div>
          </div>
        </div>`;
    }

    function renderItinerary(itin) {
      const el = document.getElementById("activity");
      renderItineraryMap(itin.route, itin.completed ? "__completed__" : itin.step.id);

      if (itin.completed) {
        renderedItineraryStepId = "__completed__";
        el.innerHTML = `
          <div class="completed-banner">
            <div class="completed-icon">🏁</div>
            <div class="completed-title">Percorso completato!</div>
            <div class="completed-pts">Punteggio finale: <strong>${itin.score}</strong></div>
          </div>`;
        return;
      }

      const step = itin.step;
      const progress = `Tappa ${itin.position} di ${itin.totalSteps}`;

      if (step.view.type === "start" || step.view.type === "voucher") {
        if (renderedItineraryStepId !== step.id) {
          renderedItineraryStepId = step.id;
          submitItinerary(step.id, {});
        }
        el.innerHTML = `${tappaHeader(progress, step.title)}<div class="clue-box">${step.body}</div><p><em>Invio in corso…</em></p>`;
        return;
      }

      if (renderedItineraryStepId === step.id) return; // form già disegnato per questa tappa, non ridisegnare ad ogni poll
      renderedItineraryStepId = step.id;

      const hintBtn = step.hasHint
        ? `<button type="button" id="hintBtn" class="btn btn-secondary">💡 Suggerimento (-punti)</button><p id="hintText" class="hint-box hidden"></p>`
        : "";

      if (step.view.type === "textMatch") {
        el.innerHTML = `
          ${tappaHeader(progress, step.title)}
          <div class="clue-box">${step.body}</div>
          <input id="answerInput" placeholder="La tua risposta" autocomplete="off" />
          <button id="answerSubmitBtn" class="btn btn-primary">Invia risposta</button>
          ${hintBtn}
          <p id="submitErr"></p>`;
        document.getElementById("answerSubmitBtn").addEventListener("click", () => {
          const answer = document.getElementById("answerInput").value.trim();
          if (!answer) return;
          submitItinerary(step.id, { answer });
        });
      } else if (step.view.type === "geoAnswer") {
        el.innerHTML = `
          ${tappaHeader(progress, step.title)}
          <div class="clue-box">${step.body}</div>
          <button id="geoDetectBtn" class="btn btn-gold">📍 Rileva posizione</button>
          <div id="geoManualFallback" class="hidden">
            <p class="status-fallback"><small>Non riusciamo a rilevare la posizione automaticamente. Inserite le coordinate a mano (es. lette da Google Maps, o chiedete al facilitatore):</small></p>
            <input id="geoLatInput" type="number" step="any" placeholder="Latitudine" />
            <input id="geoLngInput" type="number" step="any" placeholder="Longitudine" />
            <button id="geoManualSubmitBtn" class="btn btn-primary">Invia coordinate</button>
          </div>
          ${hintBtn}
          <p id="submitErr"></p>`;
        document.getElementById("geoDetectBtn").addEventListener("click", () => {
          document.getElementById("submitErr").textContent = "";
          if (!navigator.geolocation) {
            document.getElementById("geoManualFallback").classList.remove("hidden");
            return;
          }
          navigator.geolocation.getCurrentPosition(
            (pos) => submitItinerary(step.id, { lat: pos.coords.latitude, lng: pos.coords.longitude }),
            () => document.getElementById("geoManualFallback").classList.remove("hidden"),
            { enableHighAccuracy: true, timeout: 10000 }
          );
        });
        document.getElementById("geoManualSubmitBtn").addEventListener("click", () => {
          const lat = parseFloat(document.getElementById("geoLatInput").value);
          const lng = parseFloat(document.getElementById("geoLngInput").value);
          if (Number.isNaN(lat) || Number.isNaN(lng)) {
            document.getElementById("submitErr").textContent = "Inserite latitudine e longitudine valide.";
            return;
          }
          submitItinerary(step.id, { lat, lng });
        });
      } else if (step.view.type === "photoApproval") {
        el.innerHTML = `
          ${tappaHeader(progress, step.title)}
          <div class="clue-box">${step.body}</div>
          <input id="photoInput" type="file" accept="image/*" capture="environment" />
          <button id="photoSubmitBtn" class="btn btn-primary">Invia foto</button>
          <p id="submitErr"></p>`;
        document.getElementById("photoSubmitBtn").addEventListener("click", submitPhoto);
      } else if (step.view.type === "finale") {
        el.innerHTML = `
          ${tappaHeader(progress, step.title)}
          <div class="clue-box">${step.body}</div>
          ${lastVoucherToken ? `<div class="voucher-card"><div class="voucher-title">Buono ottenuto</div><div class="voucher-code">${lastVoucherToken}</div></div>` : ""}
          <button id="finaleBtn" class="btn btn-gold">Conferma arrivo</button>
          <p id="submitErr"></p>`;
        document.getElementById("finaleBtn").addEventListener("click", () => submitItinerary(step.id, {}));
      } else {
        el.innerHTML = `${tappaHeader(progress, step.title)}<div class="clue-box">${step.body}</div><p>Tipo di tappa non supportato da questa interfaccia.</p>`;
      }

      if (step.hasHint) {
        document.getElementById("hintBtn").addEventListener("click", requestHint);
      }
    }

    async function submitItinerary(stepId, payload) {
      try {
        const result = await api("/api/team/itinerary/submit", {
          method: "POST",
          body: JSON.stringify({ stepId, payload, idempotencyKey: crypto.randomUUID() }),
        });
        if (result.voucherToken) lastVoucherToken = result.voucherToken;
        renderedItineraryStepId = null; // forza il ridisegno alla prossima poll (tappa cambiata o esito noto)
        poll();
      } catch (e) {
        const err = document.getElementById("submitErr");
        if (err) err.textContent = e.message;
      }
    }

    async function submitPhoto() {
      const input = document.getElementById("photoInput");
      const file = input.files && input.files[0];
      if (!file) {
        document.getElementById("submitErr").textContent = "Seleziona o scatta una foto.";
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        const stepId = renderedItineraryStepId;
        submitItinerary(stepId, { photoBase64: reader.result });
      };
      reader.readAsDataURL(file);
    }

    async function requestHint() {
      try {
        const hint = await api("/api/team/itinerary/hint", { method: "POST", body: JSON.stringify({}) });
        const hintText = document.getElementById("hintText");
        hintText.innerHTML = `<span class="hint-label">Suggerimento</span>${hint.text}`;
        hintText.classList.remove("hidden");
      } catch (e) {
        alert(e.message);
      }
    }

    // Registro dei renderer per tipo di attività (v5.1, preparazione
    // minima): oggi c'è solo "classification" e il comportamento non
    // cambia, ma un secondo modulo aggiunge una entry qui invece di un
    // altro `if (state.activity.type === ...)`.
    const activityRenderers = {
      classification: renderClassification,
    };

    function renderClassification(el, activity, activityId) {
      el.innerHTML =
        `${tappaHeader("Fase in corso", "Classificate i collaboratori")}` +
        activity.items
          .map(
            (item) => `
        <div class="clue-box" style="margin-bottom:10px">
          <div style="margin-bottom:8px">${item.label}</div>
          <select data-item="${item.id}">
            <option value="">-- categoria --</option>
            ${activity.categories.map((c) => `<option value="${c}">${c}</option>`).join("")}
          </select>
        </div>`
          )
          .join("") +
        `<button id="submitBtn" class="btn btn-primary">Invia</button><p id="submitErr"></p>`;

      document.getElementById("submitBtn").addEventListener("click", () => submitClassification(activityId));
    }

    async function submitClassification(activityId) {
      const assignments = {};
      let complete = true;
      document.querySelectorAll("[data-item]").forEach((sel) => {
        if (!sel.value) complete = false;
        assignments[sel.dataset.item] = sel.value;
      });
      if (!complete) {
        document.getElementById("submitErr").textContent = "Assegna una categoria a tutti gli elementi.";
        return;
      }
      try {
        await api("/api/team/submissions", {
          method: "POST",
          body: JSON.stringify({
            activityId,
            idempotencyKey: crypto.randomUUID(),
            payload: { assignments },
          }),
        });
        poll();
      } catch (e) {
        document.getElementById("submitErr").textContent = e.message;
      }
    }

    document.getElementById("loginBtn").addEventListener("click", login);
    document.getElementById("code").addEventListener("keydown", (e) => {
      if (e.key === "Enter") login();
    });

    if (token) showGame();
  </script>
</body>
</html>
